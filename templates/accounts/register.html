{% extends 'base.html' %}
{% load static %}

{% block content %}


<div class="auth-page">


<div class="auth-container">



<div class="auth-left">


<h1>
CampusKart
</h1>


<p>
Join your campus marketplace community.
</p>


<img src="{% static 'images/student.png' %}"
class="auth-image">


</div>




<div class="auth-card">


<h2>
Create Account
</h2>


<p class="text-muted">
Register as a student
</p>



<form method="POST">

{% csrf_token %}


<div class="input-box">

<label>
Username
</label>

<input type="text"
name="username"
placeholder="Create username"
required>

</div>




<div class="input-box">

<label>
Email
</label>

<input type="email"
name="email"
placeholder="Enter email"
required>

</div>





<div class="input-box">

<label>
Password
</label>

<input type="password"
name="password"
placeholder="Create password"
required>

</div>





<button class="auth-btn">

Register

</button>



</form>



<p class="bottom-text">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>


</p>



</div>



</div>


</div>



{% endblock %}
